<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.55 Sora,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;background-image:radial-gradient(60vw 45vh at 85% -5%,rgba(255,180,84,.13),transparent 70%),radial-gradient(50vw 40vh at 0 100%,rgba(139,124,255,.15),transparent 70%);background-attachment:fixed}

.side{padding:24px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}

.brand i{width:36px;height:36px;border-radius:11px;background:linear-gradient(160deg,var(--am),var(--em));display:grid;place-items:center;font:900 19px "Noto Serif SC",serif;color:#2a1200;font-style:normal}

.u:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(255,180,84,.5)}.u:disabled{opacity:.45;cursor:not-allowed}.u b{display:block}.u small{color:var(--mu)}.u .st{color:var(--am);letter-spacing:2px;font-size:13px}

.inp{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font:inherit}
.tg{display:flex;align-items:center;justify-content:space-between;padding:6px 0}.sw{width:46px;height:26px;border-radius:99px;background:var(--s2);border:1px solid var(--line);position:relative;cursor:pointer}

.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--am),var(--am2));border-radius:9px;transition:width .4s}
.lb{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-bottom:24px}

.mkb{width:92px;height:92px;border-radius:50%;border:0;background:var(--em);color:#fff;cursor:pointer;margin:0 auto;display:grid;place-items:center;box-shadow:0 8px 30px rgba(255,107,74,.4)}.mkb.on{animation:pu 1s infinite}.mkb:disabled{opacity:.6}
@keyframes pu{50%{box-shadow:0 0 0 18px rgba(255,107,74,0)}}
.fin{text-align:center;padding:30px 0}.fin .lanw{margin:0 auto 10px;animation:none}
/* coach */
#log{display:flex;flex-direction:column;gap:10px;height:min(52vh,460px);overflow:auto;padding:4px}
.m{max-width:86%;padding:10px 14px;border-radius:16px;border:1px solid var(--line)}.m.me{align-self:flex-end;background:rgba(255,180,84,.16);border-color:rgba(255,180,84,.3)}.m.ai{align-self:flex-start;background:var(--s2)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font:13px Sora;cursor:pointer}.chip:hover{border-color:var(--am)}
.cin{display:flex;gap:8px}.cin .inp{flex:1}.cin .btn{width:46px;padding:0}
.bd{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--s2);color:var(--mu);font-weight:400;vertical-align:middle;margin-left:6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:99;max-width:90vw;display:none}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(12,11,29,.93);backdrop-filter:blur(14px);border-top:1px solid var(--line);border-right:0;z-index:20;justify-content:space-around}

/* ---------- content ---------- */
const U=[["Greetings",[["你好","nǐ hǎo","hello"],["谢谢","xièxie","thank you"],["再见","zàijiàn","goodbye"],["对不起","duìbuqǐ","sorry"]]],

 if(cap){try{await cap.requestPermissions();const r=await cap.start({language:"zh-CN",maxResults:1,partialResults:false,popup:false});res((r.matches||[""])[0]||"")}catch(e){rej(e)}return}

function gate(){
 const G={};
 A.innerHTML=`<div class="land"><section class="hero"><div class="lanw">${LAN}</div><h1>Dengyu <span class="zh">灯语</span></h1><p class="lead">Learn Mandarin by speaking it. Short lessons, instant voice feedback, and an AI coach that talks back.</p><ul class="pts"><li>48 starter words across 12 unit lanterns</li><li>Say it aloud and the app checks what it hears</li><li>Free, private, runs entirely in your browser</li></ul></section>

  const buf=new Uint8Array(an.fftSize);let hot=0;
  (function loop(){if(!$("#lv"))return;an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const d=(v-128)/128;s+=d*d}const rms=Math.sqrt(s/buf.length);
   $("#lv").style.width=Math.min(100,rms*400)+"%";if(rms>.04&&++hot>12&&!G.s2){mark("s2");msg("We can hear you.")}raf=requestAnimationFrame(loop)})()};
 $("#g2").onclick=async()=>{$("#g2").disabled=true;msg("Playing…");await say("你好，欢迎来到灯语");$("#g2").disabled=false;if(!G.s3){msg("Did you hear it?");$("#g2").textContent="Yes, I heard it";$("#g2").onclick=()=>{mark("s3");$("#g2").classList.add("hide");msg("")}}};
 $("#g3").onclick=async()=>{msg("Listening… say 你好");$("#g3").disabled=true;try{const t=await listen();msg(/你好|您好/.test(t)?"Recognized: "+t+". Voice exercises will work.":t?"Heard “"+t+"”. Try 你好 again.":"Nothing heard. Try again.")}catch(e){msg("Voice recognition isn't supported in this browser. Chrome or Edge work best. You can still type in the coach.")}$("#g3").disabled=false};
 $("#go").onclick=()=>{passed=true;stopMic();location.hash="#learn";route()}}
/* ---------- learn ---------- */
const open=i=>i===0||S.done[i-1]!==undefined;
function home(c){
 const d=Object.keys(S.done).length,nx=U.findIndex((u,i)=>S.done[i]===undefined),p=Math.min(1,todayXP()/S.goal),C=2*Math.PI*34;
 c.innerHTML=`<header class="hd"><p class="mu">${S.streak?S.streak+"-day streak":"Start your streak today"}</p><h1>Light your path</h1></header>
 <div class="g2"><div class="card goal"><svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="34" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/><circle cx="42" cy="42" r="34" fill="none" stroke="#ffb454" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 42 42)"/></svg><div><b>${todayXP()} / ${S.goal} XP</b><span class="mu">Today's goal</span></div></div><div class="card"><b class="num">${d} / ${U.length}</b><span class="mu">lanterns lit · ${S.xp} XP</span></div></div>
 ${nx>-1?`<div class="card cont"><div><p class="mu">Up next</p><h2>${U[nx][0]}</h2><p class="zh mu">${U[nx][1].map(w=>w[0]).join(" · ")}</p></div><button class="btn pri" data-i="${nx}">Start lesson</button></div>`:`<div class="card">Every lantern is lit. Replay any unit to keep your streak going.</div>`}
 <h2 style="margin-top:22px">Your path</h2><div class="path">${U.map((u,i)=>{const st=S.done[i];return `<button class="u" data-i="${i}" ${open(i)?"":"disabled"} aria-label="${u[0]}${open(i)?"":" (locked)"}">${lamp(st!==undefined)}<span><b>${u[0]}</b><small class="zh">${u[1].slice(0,2).map(w=>w[0]).join(" ")}</small><span class="st">${st!==undefined?"★".repeat(st)+"☆".repeat(3-st):open(i)?"Ready":"Locked"}</span></span></button>`}).join("")}</div>`;
 c.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>lesson(+b.dataset.i))}
function lesson(ui){
 inLesson=true;const u=U[ui],steps=[];
 u[1].forEach(w=>steps.push({t:"learn",w}));["pick","hear","say"].forEach(t=>shuf(u[1]).forEach(w=>steps.push({t,w})));
 let i=0,ok=0,tot=0,gain=0;
 const exit=()=>{inLesson=false;say("");route()};
 const frame=(body,foot)=>{A.innerHTML=`<div class="ls"><div class="lt"><button class="btn ghost" id="x" aria-label="Close lesson">${ic("x")}</button><div class="bar"><b style="width:${Math.min(100,i/steps.length*100)}%"></b></div></div><div class="lb">${body}</div><div class="lf" id="lf">${foot||""}</div></div>`;$("#x").onclick=exit};
 const nxt=()=>{i++;show()};
 const fb=(good,txt)=>{const f=$("#lf");f.className="lf "+(good?"g":"b");f.innerHTML=`<div class="fm"><b>${good?"Correct":"Not quite"}</b><span>${txt}</span></div><button class="btn pri" id="nx">Continue</button>`;$("#nx").onclick=nxt;$("#nx").focus()};
 const score=(s,good,xp)=>{if(!s.r){tot++;if(good){ok++;addXP(xp);gain+=xp}}if(!good)steps.push({...s,r:1})};
 function show(){
  if(i>=steps.length){const r=ok/tot,st=r>.85?3:r>.6?2:1;S.done[ui]=Math.max(S.done[ui]||0,st);bump();inLesson=false;
   const nu=ui+1<U.length;A.innerHTML=`<div class="ls"><div class="lb fin" id="done"><div class="lanw">${LAN}</div><h1>${u[0]} lit up</h1><p class="mu" style="margin:8px 0">${"★".repeat(st)}${"☆".repeat(3-st)} · ${ok} of ${tot} right first time · +${gain} XP</p></div><div class="lf">${nu?`<button class="btn pri" id="nu" style="flex:1">Next unit</button>`:""}<button class="btn" id="bk" style="flex:1">Back to path</button></div></div>`;
   $("#bk").onclick=exit;if(nu)$("#nu").onclick=()=>lesson(ui+1);return}
  const s=steps[i],w=s.w,py=`<div class="pyl">${w[1]}</div>`,hz=`<div class="hz">${w[0]}</div>`;
  if(s.t==="learn"){frame(`<p class="q">New word</p>${hz}${py}<p class="q">${esc(w[2])}</p><div class="row" style="justify-content:center"><button class="btn" id="pl">${ic("play",16)} Listen</button><button class="btn" id="sl">Slow</button></div>`,`<button class="btn pri big" id="nx">Continue</button>`);
   $("#pl").onclick=()=>say(w[0]);$("#sl").onclick=()=>say(w[0],1);$("#nx").onclick=nxt;say(w[0])}
  else if(s.t==="pick"||s.t==="hear"){const pick=s.t==="pick",pool=shuf(ALL.filter(x=>x[0]!==w[0])).slice(0,2),opts=shuf([w,...pool]);
   frame(pick?`<p class="q">What does this mean?</p>${hz}${py}`:`<p class="q">Listen, then pick what you heard</p><button class="mkb" id="pl" style="background:var(--am);color:#2a1500;box-shadow:none" aria-label="Play audio">${ic("play",34)}</button>`,
    opts.map(o=>`<button class="opt ${pick?"":"z"}" ${o===w?'data-ok="1"':""}>${esc(pick?o[2]:o[0])}</button>`).join(""));
   if(!pick){$("#pl").onclick=()=>say(w[0]);say(w[0])}
   M(".opt").forEach(b=>b.onclick=()=>{const good=b.dataset.ok==="1";M(".opt").forEach(x=>{x.disabled=true;if(x.dataset.ok)x.classList.add("ok")});if(!good)b.classList.add("no");score(s,good,5);if(pick)say(w[0]);fb(good,good?esc(w[0]+" · "+w[1]):esc(w[0]+" · "+w[1]+" · "+w[2]))})}
  else{frame(`<p class="q">Say it out loud</p>${hz}${py}<p class="q">${esc(w[2])}</p><button class="mkb" id="mk" aria-label="Tap and speak">${ic("mic",36)}</button><p id="hint" class="q" style="min-height:24px">Tap the mic and say it</p><div class="row" style="justify-content:center"><button class="btn" id="pl">${ic("play",16)} Listen first</button></div>`,`<button class="btn big" id="sk">Skip</button>`);
   $("#pl").onclick=()=>say(w[0]);$("#sk").onclick=()=>{score(s,false,0);s.r=1;nxt()};
   $("#mk").onclick=async()=>{const b=$("#mk");b.disabled=true;b.classList.add("on");$("#hint").textContent="Listening…";
    try{const t=await listen(),good=t.replace(/[^\u4e00-\u9fff]/g,"").includes(w[0]);b.classList.remove("on");b.disabled=false;
     if(good){score(s,true,10);fb(true,"I heard "+esc(t))}else $("#hint").textContent=t?"I heard “"+t+"”. Try again.":"I didn't catch that. Try again."}
    catch(e){b.classList.remove("on");b.disabled=false;$("#hint").textContent="Voice isn't available here. Skip, or use Chrome or Edge."}}}}
 function M(s){return[...A.querySelectorAll(s)]}
 show()}
/* ---------- words ---------- */
function words(c){
 c.innerHTML=`<header class="hd"><h1>Words</h1><p class="mu">Tap any word to hear it. Words from finished units are marked.</p></header><input class="inp" id="q" placeholder="Search English, pinyin or 汉字" aria-label="Search words"><div class="card" style="margin-top:14px" id="wl"></div>`;
 const draw=q=>{q=q.trim().toLowerCase();const L=[];U.forEach((u,i)=>u[1].forEach(w=>{if(!q||(w[0]+w[1]+w[2]).toLowerCase().includes(q))L.push([w,S.done[i]!==undefined])}));
  $("#wl").innerHTML=L.length?L.map(([w,d],k)=>`<div class="wl"><span class="hz2">${w[0]}</span><span class="mid"><span class="py">${w[1]}</span><br><span class="mu">${esc(w[2])}</span></span>${d?'<span class="mu" title="Learned">✓</span>':""}<button class="btn" data-k="${k}" aria-label="Play ${esc(w[2])}">${ic("play",16)}</button></div>`).join(""):`<p class="mu">No words match “${esc(q)}”. Try an English word like “tea”.</p>`;
  $("#wl").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>say(L[+b.dataset.k][0][0]))};
 $("#q").oninput=e=>draw(e.target.value);draw("")}
/* ---------- AI coach ---------- */
const H=[],SYS='You are Dengyu, a warm Mandarin tutor for English speakers. Reply ONLY with JSON: {"zh":"short Chinese reply (HSK 1-2)","py":"tone-marked pinyin of zh","en":"English translation","tip":"one short correction or tip, may be empty"}. End with a simple question.';
async function ask(){
 const m=H.slice(-10);while(m.length&&m[0].role!=="user")m.shift();
 const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:400,system:SYS,messages:m})});
 if(!r.ok)throw new Error(r.status===401?"key rejected":"error "+r.status);
 const j=await r.json(),t=j.content[0].text;try{return JSON.parse(t.match(/\{[\s\S]*\}/)[0])}catch(e){return{zh:"",py:"",en:t,tip:""}}}
function offline(t){
 const low=t.toLowerCase(),hit=ALL.find(w=>new RegExp("\\b"+w[2].toLowerCase().replace(/[^a-z' ]/g,"")+"\\b").test(low));
 if(hit)return{zh:hit[0],py:hit[1],en:"“"+hit[2]+"” in Mandarin",tip:"Tap the speaker, then say it aloud. Add an API key in Settings for full conversations."};
 if(/你好|hello|\bhi\b|hey/.test(low))return{zh:"你好！你叫什么名字？",py:"nǐ hǎo! nǐ jiào shénme míngzi?",en:"Hello! What's your name?",tip:"Reply with 我叫… (wǒ jiào…) and your name."};
 if(/名字|\bname\b|我叫/.test(low))return{zh:"很高兴认识你！",py:"hěn gāoxìng rènshi nǐ!",en:"Nice to meet you!",tip:""};
 return{zh:"你今天怎么样？",py:"nǐ jīntiān zěnmeyàng?",en:"How are you today?",tip:"Try asking “how do I say tea?” and I'll look it up."}}
function coach(c){
 c.innerHTML=`<header class="hd"><h1>AI Coach<span class="bd" id="md"></span></h1></header><div class="card"><div id="log" aria-live="polite"></div><div class="chips">${["How do I say thank you?","Teach me a greeting","How do I say tea?","Say goodbye"].map(x=>`<button class="chip">${x}</button>`).join("")}</div><div class="cin"><input class="inp" id="ti" placeholder="Type English or 中文" autocomplete="off" aria-label="Message"><button class="btn" id="mk" aria-label="Speak">${ic("mic")}</button><button class="btn pri" id="sd" aria-label="Send">${ic("send")}</button></div></div>`;
 const log=$("#log"),mode=l=>$("#md").textContent=l?"AI online":"Phrasebook mode";
 const bub=o=>{const d=document.createElement("div");d.className="m "+o.r;d.innerHTML=o.r==="me"?esc(o.text):o.typing?"…":`${o.zh?`<button aria-label="Play">${ic("play",16)}</button><div class="z">${esc(o.zh)}</div><div class="p">${esc(o.py)}</div>`:""}<div class="mu">${esc(o.en)}</div>${o.tip?`<div class="t">💡 ${esc(o.tip)}</div>`:""}`;const b=d.querySelector("button");if(b)b.onclick=()=>say(o.zh);log.append(d);log.scrollTop=log.scrollHeight;return d};
 async function send(t){t=t.trim();if(!t)return;$("#ti").value="";H.push({role:"user",content:t});bub({r:"me",text:t});let o,live=0;
  if(S.key){const ty=bub({r:"ai",typing:1});try{o=await ask();live=1}catch(e){toast("AI unavailable ("+e.message+"). Using the phrasebook.")}ty.remove()}
  if(!o)o=offline(t);H.push({role:"assistant",content:(o.zh||"")+" "+(o.en||"")});bub({r:"ai",...o});mode(live);say(o.zh)}
 mode(0);bub({r:"ai",zh:"你好！我们聊聊吧。",py:"nǐ hǎo! wǒmen liáoliao ba.",en:"Hi! Let's chat. Type, tap a suggestion, or use the mic."});
 c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>send(b.textContent));
 $("#sd").onclick=()=>send($("#ti").value);$("#ti").onkeydown=e=>{if(e.key==="Enter")send($("#ti").value)};
 $("#mk").onclick=async()=>{const b=$("#mk");b.disabled=true;$("#ti").placeholder="Listening…";try{send(await listen())}catch(e){toast("Voice input isn't available here. Type instead.")}$("#ti").placeholder="Type English or 中文";b.disabled=false}}
/* ---------- settings ---------- */
function settings(c){
 c.innerHTML=`<header class="hd"><h1>Settings</h1></header>
 <div class="card"><h2>Microphone</h2><p class="mu">Run the mic and speaker check again if voice exercises stop working.</p><div class="row"><button class="btn" id="rm">Run mic check</button></div></div>
 <div class="card"><h2>Voice</h2><div class="tg"><span>Speak slowly</span><div class="sw ${S.slow?"on":""}" id="sl" role="switch" tabindex="0" aria-checked="${!!S.slow}"></div></div></div>
 <div class="card"><h2>AI tutor (optional)</h2><p class="mu">Paste an Anthropic API key to chat with a real AI tutor. The key stays in this browser and is sent only to api.anthropic.com. Anyone with access to this browser could read it, so use a key with a spending limit.</p><div class="row"><input class="inp" id="key" type="password" placeholder="sk-ant-…" value="${esc(S.key)}" autocomplete="off" aria-label="API key"></div><div class="row"><button class="btn pri" id="ks">Save key</button><button class="btn" id="kr">Remove key</button></div></div>
 <div class="card"><h2>Progress</h2><p class="mu">Progress is saved in this browser only.</p><div class="row"><button class="btn" id="rs">Reset all progress</button></div></div>`;
 $("#rm").onclick=()=>{passed=false;route()};
 const tg=()=>{S.slow=S.slow?0:1;save();$("#sl").classList.toggle("on",!!S.slow);$("#sl").setAttribute("aria-checked",!!S.slow);if(S.slow)say("你好",1)};
 $("#sl").onclick=tg;$("#sl").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();tg()}};
 $("#ks").onclick=()=>{S.key=$("#key").value.trim();save();toast(S.key?"Key saved. Open AI Coach to try it.":"Key removed.")};
 $("#kr").onclick=()=>{S.key="";$("#key").value="";save();toast("Key removed.")};
 $("#rs").onclick=()=>{if(confirm("Erase all XP, streak and lantern progress?")){const k=S.key;S={xp:0,streak:0,last:"",done:{},td:{d:"",x:0},goal:30,slow:0,key:k};save();toast("Progress reset.");route()}}}
route();
</script></body></html>
